name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 完整克隆：T001 验收测试用 `git log --follow` 校验迁移前历史，
          # 默认浅克隆（fetch-depth=1）下无历史可查
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit --project apps/web/tsconfig.json

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/web/coverage/
          retention-days: 30

      - name: Build
        run: npm run build
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          AUTH_ISSUER: https://user.stringzhao.life
          AUTH_AUDIENCE: base-account-client
          AUTH_JWKS_URL: https://user.stringzhao.life/.well-known/jwks.json
          AUTH_SERVICE_ID: base-account-client
          APP_ORIGIN: https://ai-todo.stringzhao.life
          NEXT_PUBLIC_AUTH_ISSUER: https://user.stringzhao.life

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit --project apps/cli/tsconfig.json

      - name: Lint (biome)
        run: npm run lint --workspace apps/cli

      - name: Test
        run: npm run test --workspace apps/cli

      - name: Build
        run: npm run build --workspace apps/cli
