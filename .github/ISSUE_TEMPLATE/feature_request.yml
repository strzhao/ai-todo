name: 💡 功能建议 / Feature request
description: Suggest an idea / 提一个想法
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem / 要解决的问题
      description: What are you trying to do that's awkward today / 现在什么事情做起来别扭
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: The idea / 你的想法
      description: Including a sample sentence you'd type into the input box, if relevant / 如相关，给一句你会输入框里打的示例句子
    validations:
      required: true
