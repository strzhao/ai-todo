# ai-todo 独立 compose(复用 little-bee 已建的 little-bee-net 网络)
# 参照 HANDOFF-VPS-MIGRATION.md 步骤 4.2
services:
  ai-todo:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ai-todo:latest
    container_name: ai-todo
    restart: unless-stopped
    env_file: [../.env.production]
    environment:
      - NODE_ENV=production
      - PORT=3002
      - HOSTNAME=0.0.0.0
    ports:
      - "3002:3002" # 备案前直连 IP:3002;备案后可改回 expose 仅 Caddy 反代
    networks: [little-bee-net]

networks:
  little-bee-net:
    external: true # little-bee 已创建,复用
